<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HROX Enterprise Pilot</title><link rel="stylesheet" href="style.css"><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--l);background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}.tabs button.active{background:var(--p);color:#fff}.hidden{display:none}.statusbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.statusbar div{background:#fff;border:1px solid var(--l);border-radius:12px;padding:12px}.statusbar small{display:block;color:var(--m);margin-bottom:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tablewrap{overflow:auto}.tablewrap select,.tablewrap input{min-width:130px}.hero{background:linear-gradient(90deg,#edf5ff,#f5f1ff);border:1px solid #dbe7ff;border-radius:14px;padding:16px;margin-bottom:14px}@media(max-width:700px){.statusbar{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{display:flex;overflow:auto}.nav button{min-width:150px}.top{position:relative;display:block}.top select{margin-top:10px;width:100%}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">H</div><div><h1>HROX</h1><small>Enterprise Workflow Pilot</small></div></div><div class="nav"><button onclick="show('dash')">▦ <span>Dashboard</span></button><button onclick="show('plan')">▤ <span>Rotation Plan</span></button><button onclick="show('audit')">↻ <span>Audit Trail</span></button></div></aside><main class="main"><header class="top"><div><h2>Project HR Rotation & Field Operations</h2><small class="muted" id="roleName"></small></div><select id="role"><option value="director">Senior HR Director</option><option value="coordinator">HR Operations Coordinator</option><option value="visitor">Assigned HR Director</option><option value="project">Project HR Team</option></select></header><div class="content"><div class="hero"><b id="headline"></b><div class="muted" id="subhead"></div></div><div id="dash" class="page active"></div><div id="plan" class="page"></div><div id="audit" class="page"></div></div></main></div><div id="toast" class="toast"></div><script>const roles={director:'Senior HR Director',coordinator:'HR Operations Coordinator',visitor:'Assigned HR Director',project:'Project HR Team'};const people=['Ahmed Hassan','Omar Khaled','Mona Ali','Yousef Adel','Sara Nabil','Khaled Emad'];const projects=['Mataf Expansion','Shamiyah Development','Makkah Gate','Central Utility','Haram Security','North Plaza','South Service','Transport Hub','Admin Complex'];let role=localStorage.hroxRole||'director';let s=JSON.parse(localStorage.hroxFlow||'null')||{stage:0,request:false,submitted:false,approved:false,rows:projects.map((p,i)=>({project:p,priority:i<3?'High':i<6?'Medium':'Normal',director:people[i%people.length],date:'2026-07-'+String(20+i).padStart(2,'0'),reason:i<3?'High workforce exposure':'Balanced workload'})),log:['Pilot initialized']};function save(){localStorage.hroxFlow=JSON.stringify(s);render()}function note(x){s.log.unshift(new Date().toLocaleString()+' — '+x);save();toast(x)}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}function owner(){return s.stage===0?'director':s.stage===1?'coordinator':s.stage===2?'director':s.stage===3?'visitor':s.stage===4?'project':'director'}function task(){return ['Create Rotation Request','Prepare Rotation Plan','Review & Approve Plan','Complete Assigned Visit','Close Corrective Action','Review Final Report'][s.stage]}function next(){return ['HR Operations Coordinator','Senior HR Director','Assigned HR Director','Project HR Team','Senior HR Director','Workflow Completed'][s.stage]}function createReq(){if(role!=='director')return toast('Only Senior HR Director can create the request');s.request=true;s.stage=1;note('Rotation request Q3-2026 sent to HR Operations Coordinator')}function submitPlan(){if(role!=='coordinator')return toast('Only HR Operations Coordinator can submit the plan');s.submitted=true;s.stage=2;note('Coordinator submitted the complete 9-project rotation plan to Senior HR Director')}function approve(){if(role!=='director')return toast('Only Senior HR Director can approve');s.approved=true;s.stage=3;note('Senior HR Director approved the plan and released assignments')}function returnPlan(){if(role!=='director')return;s.stage=1;note('Plan returned to Coordinator for changes')}function visit(){if(role!=='visitor')return;s.stage=4;note('Assigned HR Director submitted visit findings and created corrective action')}function closeAction(){if(role!=='project')return;s.stage=5;note('Project HR Team uploaded evidence and closed the corrective action')}function finish(){if(role!=='director')return;note('Senior HR Director completed final review')}function upd(i,k,v){s.rows[i][k]=v;localStorage.hroxFlow=JSON.stringify(s)}function reset(){localStorage.removeItem('hroxFlow');location.reload()}function table(edit){return `<div class="tablewrap"><table><thead><tr><th>#</th><th>Project</th><th>Priority</th><th>Assigned HR Director</th><th>Visit Date</th><th>Allocation Reason</th><th>Status</th></tr></thead><tbody>${s.rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${r.project}</b></td><td>${edit?`<select onchange="upd(${i},'priority',this.value)"><option ${r.priority==='High'?'selected':''}>High</option><option ${r.priority==='Medium'?'selected':''}>Medium</option><option ${r.priority==='Normal'?'selected':''}>Normal</option></select>`:`<span class="pill ${r.priority==='High'?'red':r.priority==='Medium'?'orange':'blue'}">${r.priority}</span>`}</td><td>${edit?`<select onchange="upd(${i},'director',this.value)">${people.map(p=>`<option ${p===r.director?'selected':''}>${p}</option>`).join('')}</select>`:r.director}</td><td>${edit?`<input type="date" value="${r.date}" onchange="upd(${i},'date',this.value)">`:r.date}</td><td>${edit?`<input value="${r.reason}" onchange="upd(${i},'reason',this.value)">`:r.reason}</td><td><span class="pill ${s.approved?'green':s.submitted?'orange':'gray'}">${s.approved?'Approved':s.submitted?'Pending Approval':'Draft'}</span></td></tr>`).join('')}</tbody></table></div>`}function render(){let o=owner(),mine=o===role;document.getElementById('roleName').textContent=roles[role];document.getElementById('headline').textContent=mine?'Action required from you':'Workflow currently with '+roles[o];document.getElementById('subhead').textContent=task()+' • Next owner: '+next();document.getElementById('dash').innerHTML=`<div class="statusbar"><div><small>Current Owner</small><b>${roles[o]}</b></div><div><small>Current Task</small><b>${task()}</b></div><div><small>Next Owner</small><b>${next()}</b></div><div><small>SLA</small><b>1 Working Day</b></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="row"><div><h3>My Work Inbox</h3><p class="muted">Only work assigned to the selected role appears here.</p></div><span class="pill ${mine?'orange':'gray'}">${mine?'1 Open Task':'No Open Tasks'}</span></div>${mine?actionBox():'<div class="empty">No action is currently assigned to this role.</div>'}</div><div class="card"><h3>Rotation Cycle Summary</h3><p><b>Cycle:</b> Q3 2026</p><p><b>Projects:</b> 9</p><p><b>Assigned Directors:</b> ${new Set(s.rows.map(x=>x.director)).size}</p><p><b>Status:</b> ${s.approved?'Approved':s.submitted?'Pending Director Approval':s.request?'Planning in Progress':'Not Started'}</p><button class="btn light" onclick="show('plan')">Open Full Plan</button><button class="btn light" onclick="reset()">Reset Demo</button></div></div>`;let editable=role==='coordinator'&&s.stage===1;document.getElementById('plan').innerHTML=`<div class="card"><div class="row"><div><h3>Q3 2026 Rotation Plan</h3><p class="muted">The same plan is edited by the Coordinator and reviewed by the Director.</p></div><span class="pill ${s.approved?'green':s.submitted?'orange':'gray'}">${s.approved?'Approved':s.submitted?'Pending Approval':'Draft'}</span></div>${table(editable)}<div class="toolbar">${editable?'<button class="btn light" onclick="note(\'Draft plan saved\')">Save Draft</button><button class="btn primary" onclick="submitPlan()">Submit to Senior HR Director</button>':''}${role==='director'&&s.stage===2?'<button class="btn danger" onclick="returnPlan()">Return for Changes</button><button class="btn success" onclick="approve()">Approve & Release Assignments</button>':''}</div></div>`;document.getElementById('audit').innerHTML=`<div class="card"><h3>Workflow Audit Trail</h3><ul class="feed">${s.log.map(x=>'<li>'+x+'</li>').join('')}</ul></div>`}function actionBox(){if(s.stage===0)return '<h3>Create Rotation Request</h3><p>Create the Q3 rotation cycle for all 9 projects.</p><button class="btn primary" onclick="createReq()">Create & Send to Coordinator</button>';if(s.stage===1)return '<h3>Prepare Rotation Plan</h3><p>The Director request is in your inbox. Review all projects, assignments, dates and reasons.</p><button class="btn primary" onclick="show(\'plan\')">Open Planning Workspace</button>';if(s.stage===2)return '<h3>Approval Required</h3><p>The Coordinator submitted the complete plan. Review the same rows before approval.</p><button class="btn primary" onclick="show(\'plan\')">Review Submitted Plan</button>';if(s.stage===3)return '<h3>New Assignment Released</h3><p><b>Project:</b> '+s.rows[0].project+'<br><b>Date:</b> '+s.rows[0].date+'</p><button class="btn primary" onclick="visit()">Check In & Submit Visit</button>';if(s.stage===4)return '<h3>Corrective Action</h3><p>Upload evidence and close the action created from the field visit.</p><button class="btn success" onclick="closeAction()">Upload Evidence & Close</button>';return '<h3>Final Management Review</h3><p>All field and closure activities are complete.</p><button class="btn success" onclick="finish()">Complete Final Review</button>'}document.getElementById('role').value=role;document.getElementById('role').onchange=e=>{role=e.target.value;localStorage.hroxRole=role;render();show('dash')};render();</script></body></html>
