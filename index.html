<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HROX Workflow Pilot</title><style>:root{--nav:#08294d;--bg:#f4f7fb;--card:#fff;--text:#12243d;--muted:#6f7f93;--line:#dfe7ef;--blue:#3279df;--green:#18a46b;--orange:#ef9d18;--red:#e64f4f}*{box-sizing:border-box}body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--nav),#041a31);color:#fff;padding:20px 14px}.brand{display:flex;gap:10px;align-items:center;margin-bottom:24px}.logo{width:42px;height:42px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:800}.brand h1{margin:0;font-size:22px}.brand small{opacity:.7}.nav button{width:100%;border:0;background:transparent;color:#dce8f5;text-align:left;padding:12px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#1b4777}.main{min-width:0}.top{min-height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 22px;position:sticky;top:0;z-index:3}.top h2{margin:0;font-size:19px}.top select{width:230px;max-width:45vw;padding:9px;border:1px solid #d5dfeb;border-radius:8px}.content{padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 3px 12px rgba(16,36,62,.04)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.1fr .9fr}.kpi small,.muted{color:var(--muted)}.kpi strong{display:block;font-size:27px;margin:8px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px}.gray{background:#edf1f6;color:#59697b}.blue{background:#e7f0ff;color:#245cb7}.green{background:#def7ec;color:#087950}.orange{background:#fff2d6;color:#996100}.red{background:#fee2e2;color:#b52222}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}.primary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}.danger{background:var(--red);color:#fff}.light{background:#edf2f8;color:var(--text)}.notice{padding:12px;background:#eef6ff;border:1px solid #cfe2ff;border-radius:10px;margin:10px 0}.owner{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.owner div{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px}.owner b{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.timeline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.timeline span{padding:8px 10px;border-radius:20px;background:#edf1f6;font-size:12px}.timeline .done{background:#def7ec;color:#087950}.timeline .now{background:#e7f0ff;color:#245cb7}.task{border-left:4px solid var(--blue);padding-left:14px}.empty{text-align:center;color:var(--muted);padding:24px}.page{display:none}.page.active{display:block}.feed{list-style:none;padding:0;margin:0}.feed li{padding:9px 0;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{color:var(--muted)}textarea,input{width:100%;padding:9px;border:1px solid #d5dfeb;border-radius:8px}.toast{position:fixed;right:18px;bottom:18px;background:#12243d;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:10}@media(max-width:900px){.app{grid-template-columns:74px 1fr}.brand div:last-child,.nav span{display:none}.nav button{text-align:center}.g4,.g2,.owner{grid-template-columns:1fr 1fr}}@media(max-width:650px){.g4,.g2,.owner{grid-template-columns:1fr}.content{padding:12px}.top{padding:10px}.top h2{font-size:14px}.top select{width:155px}.side{padding:16px 8px}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">H</div><div><h1>HROX</h1><small>Workflow Pilot</small></div></div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><div><h2>Project HR Rotation & Field Operations</h2><small class="muted" id="roleText"></small></div><select id="role"><option value="director">Senior HR Director</option><option value="coordinator">HR Operations Coordinator</option><option value="visitor">Assigned HR Director</option><option value="project">Project HR Team</option></select></header><div class="content"><section id="dashboard" class="page active"></section><section id="work" class="page"></section><section id="timeline" class="page"></section></div></main></div><div class="toast" id="toast"></div><script>const roles={director:{name:'Senior HR Director'},coordinator:{name:'HR Operations Coordinator'},visitor:{name:'Assigned HR Director'},project:{name:'Project HR Team'}};const stages=[{owner:'director',task:'Create Rotation Request',action:'Create and send the Q3 project rotation request',next:'HR Operations Coordinator'},{owner:'coordinator',task:'Prepare Rotation Plan',action:'Accept the request, generate the AI allocation, and submit it',next:'Senior HR Director'},{owner:'director',task:'Approve Rotation Plan',action:'Review the proposed assignments and approve or return them',next:'Assigned HR Director'},{owner:'visitor',task:'Complete Field Visit',action:'Confirm assignment, check in, record findings, and submit the visit',next:'Project HR Team'},{owner:'project',task:'Close Corrective Action',action:'Start the action, upload evidence, and close it',next:'Senior HR Director'},{owner:'director',task:'Review Final Report',action:'Review completed visit and closed action',next:'Workflow Completed'}];let role=localStorage.getItem('hroxRole3')||'director';let state=JSON.parse(localStorage.getItem('hroxState3')||'null')||{stage:0,history:['Workflow initialized']};function save(){localStorage.setItem('hroxState3',JSON.stringify(state));render()}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1700)}function current(){return stages[Math.min(state.stage,stages.length-1)]}function buildNav(){document.getElementById('nav').innerHTML='<button data-page="dashboard" class="active">▦ <span>My Dashboard</span></button><button data-page="work">☑ <span>My Work</span></button><button data-page="timeline">↻ <span>Workflow Timeline</span></button>';document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page))}function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id))}function act(){const c=current();if(c.owner!==role)return toast('This task is currently with '+roles[c.owner].name);state.history.unshift(roles[role].name+' completed: '+c.task);state.stage=Math.min(state.stage+1,stages.length-1);save();show('dashboard');toast('Task sent to '+current().owner)}function returnTask(){if(!(role==='director'&&state.stage===2))return toast('Return action is not available');state.history.unshift('Senior HR Director returned the plan for changes');state.stage=1;save();toast('Task returned to coordinator')}function reset(){localStorage.removeItem('hroxState3');location.reload()}function render(){const c=current();document.getElementById('roleText').textContent=roles[role].name;const mine=c.owner===role;const completed=state.stage===stages.length-1;document.getElementById('dashboard').innerHTML=`<div class="grid g4"><div class="card kpi"><small>My Open Tasks</small><strong>${mine&&!completed?1:0}</strong><small>Assigned to current role</small></div><div class="card kpi"><small>Workflow Stage</small><strong>${state.stage+1}/${stages.length}</strong><small>${c.task}</small></div><div class="card kpi"><small>Current Owner</small><strong style="font-size:18px">${roles[c.owner].name}</strong><small>Responsible now</small></div><div class="card kpi"><small>Status</small><strong style="font-size:18px">${completed?'Completed':mine?'Action Required':'Waiting'}</strong><small>${mine?'Your response is needed':'No action for this role'}</small></div></div><div class="grid g2" style="margin-top:14px"><div class="card task"><div class="row"><h3>Active Workflow Task</h3><span class="pill ${mine?'orange':'blue'}">${mine?'Action Required':'Waiting'}</span></div><h2>${c.task}</h2><div class="owner"><div><b>Current Owner</b>${roles[c.owner].name}</div><div><b>Action Required</b>${c.action}</div><div><b>Next Owner</b>${c.next}</div><div><b>SLA</b>1 Working Day</div></div>${mine?'<button class="btn primary" onclick="show(\'work\')">Open My Task</button>':'<div class="notice">This task is currently with <b>'+roles[c.owner].name+'</b>. Switch to that role to continue.</div>'}<button class="btn light" onclick="reset()">Reset Pilot</button></div><div class="card"><h3>Recent Activity</h3><ul class="feed">${state.history.slice(0,7).map(x=>'<li>'+x+'</li>').join('')}</ul></div></div>`;let actionArea='';if(mine&&!completed){if(state.stage===0)actionArea='<p>Create the Q3 rotation cycle and assign it to HR Operations.</p><button class="btn primary" onclick="act()">Create & Send Request</button>';if(state.stage===1)actionArea='<p>You received a new planning task from the Senior HR Director.</p><button class="btn light">Accept Task</button><button class="btn primary" onclick="act()">Generate AI Plan & Submit</button>';if(state.stage===2)actionArea='<p>Review nine proposed project assignments.</p><button class="btn danger" onclick="returnTask()">Return for Changes</button><button class="btn success" onclick="act()">Approve Final Plan</button>';if(state.stage===3)actionArea='<p><b>Assignment:</b> Project Alpha • 20 July 2026 • 09:00</p><textarea rows="4">Several employee contracts are incomplete. Project HR Team must complete them within five working days.</textarea><br><button class="btn light">Check In</button><button class="btn primary" onclick="act()">Submit Visit & Create Action</button>';if(state.stage===4)actionArea='<p><b>Action:</b> Complete missing employee contracts</p><p><b>Priority:</b> High • <b>Due:</b> 5 working days</p><button class="btn light">Upload Evidence</button><button class="btn success" onclick="act()">Close Action</button>';if(state.stage===5)actionArea='<p>All operational steps are complete. Review the cycle summary.</p><button class="btn success" onclick="act()">Confirm Final Report</button>'}else actionArea='<div class="empty">No task is assigned to this role right now.</div>';document.getElementById('work').innerHTML=`<div class="card"><div class="row"><div><h3>My Work Inbox</h3><p class="muted">Only tasks assigned to the selected role appear here.</p></div><span class="pill ${mine?'orange':'gray'}">${mine?'1 Open Task':'No Open Tasks'}</span></div>${actionArea}</div>`;document.getElementById('timeline').innerHTML=`<div class="card"><h3>Workflow Timeline</h3><div class="timeline">${stages.map((s,i)=>'<span class="'+(i<state.stage?'done':i===state.stage?'now':'')+'">'+(i+1)+'. '+s.task+'</span>').join('')}</div><div style="margin-top:18px">${stages.map((s,i)=>'<div class="owner"><div><b>Stage</b>'+(i+1)+'</div><div><b>Owner</b>'+roles[s.owner].name+'</div><div><b>Required Action</b>'+s.task+'</div><div><b>Status</b>'+(i<state.stage?'Completed':i===state.stage?'Current':'Pending')+'</div></div>').join('')}</div></div>`}document.getElementById('role').value=role;document.getElementById('role').onchange=e=>{role=e.target.value;localStorage.setItem('hroxRole3',role);render();show('dashboard')};buildNav();render();</script></body></html>
