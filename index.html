<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HROX Enterprise</title><link rel="stylesheet" href="style.css"><style>.nav button.active{background:linear-gradient(90deg,#285ea8,#6b55df);color:#fff}.navcount{float:right;background:#ef4444;color:#fff;border-radius:12px;padding:1px 7px;font-size:10px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;color:#2f6fed;text-transform:uppercase}.hero{background:linear-gradient(120deg,#fff,#eef4ff 55%,#f5f0ff);border:1px solid #dce6fb;border-radius:18px;padding:22px;margin-bottom:16px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h2{margin:5px 0;font-size:25px}.hero p{margin:0;color:var(--m)}.live{display:inline-flex;align-items:center;gap:7px;background:#e9f8f1;color:#08784f;border-radius:20px;padding:7px 11px;font-weight:700;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#16a36d}.statusbar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.statusbar .card{padding:15px}.statusbar small{color:var(--m);display:block;margin-bottom:6px}.statusbar b{font-size:14px}.inboxgrid{display:grid;grid-template-columns:1.35fr .65fr;gap:15px;margin-top:15px}.taskitem{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--l)}.taskicon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#edf3ff;color:#2f6fed;font-weight:800}.taskitem h4{margin:0 0 4px}.taskitem p{margin:0;color:var(--m);font-size:12px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.mini{font-size:11px;background:#f0f3f8;border-radius:14px;padding:4px 8px;color:#536176}.noticeitem{padding:12px;border-radius:12px;background:#f8faff;border:1px solid var(--l);margin:9px 0}.noticeitem strong{font-size:13px}.noticeitem p{font-size:12px;color:var(--m);margin:5px 0 0}.workflow{display:flex;gap:8px;overflow:auto;padding:4px 0 8px}.wstep{min-width:130px;padding:11px;border-radius:12px;background:#f7f9fc;border:1px solid var(--l)}.wstep.done{background:#edf9f4;border-color:#bce8d5}.wstep.now{background:#edf4ff;border-color:#9ebff5}.wstep b{font-size:12px;display:block}.wstep small{color:var(--m)}.page{display:none}.page.active{display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tablewrap{overflow:auto}.tablewrap select,.tablewrap input{min-width:130px}.feed li{position:relative;padding-left:22px}.feed li:before{content:'';position:absolute;left:2px;top:15px;width:8px;height:8px;border-radius:50%;background:#2f6fed}.topactions{display:flex;align-items:center;gap:10px}.bell{position:relative;border:0;background:#f1f4f8;width:40px;height:40px;border-radius:12px;cursor:pointer}.bell span{position:absolute;top:-4px;right:-3px;background:#ef4444;color:#fff;border-radius:10px;font-size:10px;padding:2px 5px}.profile{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2f6fed,#7657df);color:#fff;display:grid;place-items:center;font-weight:800}.profile small{display:block;color:var(--m)}@media(max-width:900px){.statusbar{grid-template-columns:1fr 1fr}.inboxgrid{grid-template-columns:1fr}.profile div:last-child{display:none}}@media(max-width:650px){.statusbar{grid-template-columns:1fr}.hero{display:block}.topactions{margin-top:10px}.top{align-items:flex-start;flex-direction:column}.profile div:last-child{display:block}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">H</div><div><h1>HROX</h1><small>HR Operations Experience</small></div></div><div class="eyebrow" style="color:#93afd1;margin:18px 10px 8px">Workspace</div><div class="nav"><button id="n-dash" onclick="show('dash')">◫ <span>Overview</span></button><button id="n-inbox" onclick="show('inbox')">▣ <span>My Inbox</span><b class="navcount" id="navCount">1</b></button><button id="n-plan" onclick="show('plan')">▤ <span>Rotation Plan</span></button><button id="n-notes" onclick="show('notes')">◉ <span>Notifications</span></button><button id="n-audit" onclick="show('audit')">↻ <span>Activity & Audit</span></button></div><div style="position:absolute;bottom:18px;left:14px;right:14px;background:rgba(255,255,255,.07);padding:12px;border-radius:12px"><small style="opacity:.7">Environment</small><b style="display:block;margin-top:4px">Enterprise Pilot</b></div></aside><main class="main"><header class="top"><div><div class="eyebrow">Project HR Rotation</div><h2 style="margin:4px 0">Field Operations Command Center</h2></div><div class="topactions"><button class="bell" onclick="show('notes')">♢<span id="bellCount">3</span></button><select id="role"><option value="director">Senior HR Director</option><option value="coordinator">HR Operations Coordinator</option><option value="visitor">Assigned HR Director</option><option value="project">Project HR Team</option></select><div class="profile"><div class="avatar" id="avatar">SH</div><div><b id="roleName"></b><small>HROX Workspace</small></div></div></div></header><div class="content"><div class="hero"><div><div class="eyebrow">Q3 2026 Rotation Cycle</div><h2 id="headline"></h2><p id="subhead"></p></div><div><span class="live"><span class="dot"></span> Workflow Active</span></div></div><div id="dash" class="page active"></div><div id="inbox" class="page"></div><div id="plan" class="page"></div><div id="notes" class="page"></div><div id="audit" class="page"></div></div></main></div><div id="toast" class="toast"></div><script>const roles={director:'Senior HR Director',coordinator:'HR Operations Coordinator',visitor:'Assigned HR Director',project:'Project HR Team'},people=['Ahmed Hassan','Omar Khaled','Mona Ali','Yousef Adel','Sara Nabil','Khaled Emad'],projects=['Mataf Expansion','Shamiyah Development','Makkah Gate','Central Utility','Haram Security','North Plaza','South Service','Transport Hub','Admin Complex'];let role=localStorage.hroxRole||'director',s=JSON.parse(localStorage.hroxFlow||'null')||{stage:0,request:false,submitted:false,approved:false,rows:projects.map((p,i)=>({project:p,priority:i<3?'High':i<6?'Medium':'Normal',director:people[i%6],date:'2026-07-'+String(20+i).padStart(2,'0'),reason:i<3?'High workforce exposure':'Balanced workload'})),log:['Pilot initialized'],readNotes:0};const stages=['Request','Planning','Approval','Assignment','Visit','Actions','Report'];function save(){localStorage.hroxFlow=JSON.stringify(s);render()}function note(x){s.log.unshift(new Date().toLocaleString()+' — '+x);save();toast(x)}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');let n=document.getElementById('n-'+id);if(n)n.classList.add('active');if(id==='notes'){s.readNotes=3;localStorage.hroxFlow=JSON.stringify(s);counts()}}function owner(){return ['director','coordinator','director','visitor','project','director'][s.stage]||'director'}function task(){return ['Create Rotation Request','Prepare Rotation Plan','Review & Approve Plan','Complete Assigned Visit','Close Corrective Action','Review Final Report'][s.stage]}function next(){return ['HR Operations Coordinator','Senior HR Director','Assigned HR Director','Project HR Team','Senior HR Director','Workflow Completed'][s.stage]}function status(){return s.approved?'Approved & Released':s.submitted?'Pending Director Approval':s.request?'Planning in Progress':'Not Started'}function createReq(){if(role!=='director')return toast('This action belongs to the Senior HR Director');s.request=true;s.stage=1;note('Rotation request Q3-2026 sent to HR Operations Coordinator')}function submitPlan(){if(role!=='coordinator')return toast('This action belongs to the Coordinator');s.submitted=true;s.stage=2;note('Complete rotation plan submitted for approval')}function approve(){if(role!=='director')return toast('This action belongs to the Senior HR Director');s.approved=true;s.stage=3;note('Plan approved and assignments released')}function returnPlan(){s.stage=1;s.submitted=false;note('Plan returned to Coordinator for changes')}function visit(){if(role!=='visitor')return;s.stage=4;note('Field visit submitted and corrective action created')}function closeAction(){if(role!=='project')return;s.stage=5;note('Project HR Team closed the corrective action')}function finish(){if(role!=='director')return;note('Final management review completed')}function upd(i,k,v){s.rows[i][k]=v;localStorage.hroxFlow=JSON.stringify(s)}function reset(){localStorage.removeItem('hroxFlow');location.reload()}function counts(){let mine=owner()===role?1:0,unread=Math.max(0,3-(s.readNotes||0));document.getElementById('navCount').textContent=mine;document.getElementById('bellCount').textContent=unread;document.getElementById('navCount').style.display=mine?'inline':'none';document.getElementById('bellCount').style.display=unread?'inline':'none'}function flow(){return '<div class="workflow">'+stages.map((x,i)=>'<div class="wstep '+(i<s.stage?'done':i===s.stage?'now':'')+'"><b>'+(i<s.stage?'✓ ':i===s.stage?'● ':'○ ')+x+'</b><small>'+(i<s.stage?'Completed':i===s.stage?'In progress':'Upcoming')+'</small></div>').join('')+'</div>'}function actionBox(){if(s.stage===0)return '<h3>Create Rotation Request</h3><p class="muted">Launch the Q3 rotation cycle covering all nine projects.</p><button class="btn primary" onclick="createReq()">Create & Route Request</button>';if(s.stage===1)return '<h3>Prepare Rotation Plan</h3><p class="muted">Review assignments, priorities, dates and allocation reasons.</p><button class="btn primary" onclick="show(\'plan\')">Open Planning Workspace</button>';if(s.stage===2)return '<h3>Approval Required</h3><p class="muted">The complete plan is ready for your review.</p><button class="btn primary" onclick="show(\'plan\')">Review Submitted Plan</button>';if(s.stage===3)return '<h3>Field Visit Assignment</h3><p class="muted"><b>'+s.rows[0].project+'</b> · '+s.rows[0].date+'</p><button class="btn primary" onclick="visit()">Check In & Submit Visit</button>';if(s.stage===4)return '<h3>Corrective Action</h3><p class="muted">Upload evidence and close the action.</p><button class="btn success" onclick="closeAction()">Upload Evidence & Close</button>';return '<h3>Final Management Review</h3><p class="muted">All operational activities are complete.</p><button class="btn success" onclick="finish()">Complete Final Review</button>'}function table(edit){return '<div class="tablewrap"><table><thead><tr><th>#</th><th>Project</th><th>Priority</th><th>Assigned HR Director</th><th>Visit Date</th><th>Allocation Reason</th><th>Status</th></tr></thead><tbody>'+s.rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+r.project+'</b></td><td>'+(edit?'<select onchange="upd('+i+',\'priority\',this.value)"><option '+(r.priority==='High'?'selected':'')+'>High</option><option '+(r.priority==='Medium'?'selected':'')+'>Medium</option><option '+(r.priority==='Normal'?'selected':'')+'>Normal</option></select>':'<span class="pill '+(r.priority==='High'?'red':r.priority==='Medium'?'orange':'blue')+'">'+r.priority+'</span>')+'</td><td>'+(edit?'<select onchange="upd('+i+',\'director\',this.value)">'+people.map(p=>'<option '+(p===r.director?'selected':'')+'>'+p+'</option>').join('')+'</select>':r.director)+'</td><td>'+(edit?'<input type="date" value="'+r.date+'" onchange="upd('+i+',\'date\',this.value)">':r.date)+'</td><td>'+(edit?'<input value="'+r.reason+'" onchange="upd('+i+',\'reason\',this.value)">':r.reason)+'</td><td><span class="pill '+(s.approved?'green':s.submitted?'orange':'gray')+'">'+(s.approved?'Approved':s.submitted?'Pending Approval':'Draft')+'</span></td></tr>').join('')+'</tbody></table></div>'}function render(){let o=owner(),mine=o===role,assigned=new Set(s.rows.map(x=>x.director)).size;document.getElementById('roleName').textContent=roles[role];document.getElementById('avatar').textContent=roles[role].split(' ').map(x=>x[0]).slice(0,2).join('');document.getElementById('headline').textContent=mine?'You have an action waiting':'Workflow is currently with '+roles[o];document.getElementById('subhead').textContent=task()+' · Next owner: '+next();document.getElementById('dash').innerHTML='<div class="statusbar"><div class="card"><small>Current Owner</small><b>'+roles[o]+'</b></div><div class="card"><small>Current Task</small><b>'+task()+'</b></div><div class="card"><small>Next Owner</small><b>'+next()+'</b></div><div class="card"><small>SLA Target</small><b>1 Working Day</b></div></div><div class="card" style="margin-top:15px"><div class="row"><div><div class="eyebrow">Process Visibility</div><h3 style="margin:5px 0">End-to-End Workflow</h3></div><span class="pill blue">'+status()+'</span></div>'+flow()+'</div><div class="inboxgrid"><div class="card"><div class="row"><div><div class="eyebrow">Work Management</div><h3 style="margin:5px 0">My Work Inbox</h3></div><span class="pill '+(mine?'orange':'gray')+'">'+(mine?'1 Open Task':'No Open Tasks')+'</span></div>'+(mine?'<div class="taskitem"><div class="taskicon">01</div><div>'+actionBox()+'<div class="meta"><span class="mini">Q3 2026</span><span class="mini">SLA: 1 day</span><span class="mini">Owner: '+roles[role]+'</span></div></div><span class="pill orange">Action Required</span></div>':'<div class="empty">You are up to date. No task is currently assigned to this role.</div>')+'</div><div class="card"><div class="eyebrow">Cycle Snapshot</div><h3 style="margin:5px 0 14px">Rotation Summary</h3><p><b>Projects</b><span style="float:right">9</span></p><p><b>Assigned Directors</b><span style="float:right">'+assigned+'</span></p><p><b>Cycle</b><span style="float:right">Q3 2026</span></p><p><b>Status</b><span style="float:right">'+status()+'</span></p><button class="btn light" onclick="show(\'plan\')">Open Full Plan</button><button class="btn light" onclick="reset()">Reset Demo</button></div></div>';document.getElementById('inbox').innerHTML='<div class="card"><div class="row"><div><div class="eyebrow">Role-Based Queue</div><h3 style="margin:5px 0">My Tasks</h3><p class="muted">Only work owned by the selected role appears here.</p></div><span class="pill '+(mine?'orange':'green')+'">'+(mine?'1 pending':'All clear')+'</span></div>'+(mine?'<div class="taskitem"><div class="taskicon">HR</div><div><h4>'+task()+'</h4><p>Q3 2026 Rotation Cycle · Current owner: '+roles[o]+'</p><div class="meta"><span class="mini">Priority: High</span><span class="mini">Due: Today</span><span class="mini">Next: '+next()+'</span></div></div><button class="btn primary" onclick="'+(s.stage===1?'show(\'plan\')':s.stage===2?'show(\'plan\')':s.stage===0?'createReq()':s.stage===3?'visit()':s.stage===4?'closeAction()':'finish()')+'">Open Task</button></div>':'<div class="empty">No pending tasks for '+roles[role]+'.</div>')+'</div>';let editable=role==='coordinator'&&s.stage===1;document.getElementById('plan').innerHTML='<div class="card"><div class="row"><div><div class="eyebrow">Planning Workspace</div><h3 style="margin:5px 0">Q3 2026 Rotation Plan</h3><p class="muted">One shared plan moves through editing, review and approval.</p></div><span class="pill '+(s.approved?'green':s.submitted?'orange':'gray')+'">'+(s.approved?'Approved':s.submitted?'Pending Approval':'Draft')+'</span></div>'+table(editable)+'<div class="toolbar">'+(editable?'<button class="btn light" onclick="note(\'Draft plan saved\')">Save Draft</button><button class="btn primary" onclick="submitPlan()">Submit for Approval</button>':'')+(role==='director'&&s.stage===2?'<button class="btn danger" onclick="returnPlan()">Return for Changes</button><button class="btn success" onclick="approve()">Approve & Release</button>':'')+'</div></div>';document.getElementById('notes').innerHTML='<div class="grid g2"><div class="card"><div class="eyebrow">Notification Center</div><h3 style="margin:5px 0 14px">Notifications</h3><div class="noticeitem"><strong>Rotation cycle status updated</strong><p>'+status()+' · Q3 2026</p></div><div class="noticeitem"><strong>Workflow ownership</strong><p>Current owner is '+roles[o]+'</p></div><div class="noticeitem"><strong>SLA monitoring active</strong><p>The current task is due within one working day.</p></div></div><div class="card"><div class="eyebrow">Attention</div><h3 style="margin:5px 0 14px">Pending Approvals</h3>'+(role==='director'&&s.stage===2?'<div class="notice successbox"><b>Rotation Plan Approval</b><p>9 projects are ready for your review.</p><button class="btn primary" onclick="show(\'plan\')">Review Plan</button></div>':'<div class="empty">No approvals are waiting for this role.</div>')+'</div></div>';document.getElementById('audit').innerHTML='<div class="card"><div class="eyebrow">Traceability</div><h3 style="margin:5px 0 14px">Recent Activity & Audit Trail</h3><ul class="feed">'+s.log.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';counts()}document.getElementById('role').value=role;document.getElementById('role').onchange=e=>{role=e.target.value;localStorage.hroxRole=role;render();show('dash')};render();show('dash');</script></body></html>
